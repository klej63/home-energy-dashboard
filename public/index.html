<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Elförbrukning</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #101827; color: #eef3ff; }
    main { width: min(680px, calc(100% - 32px)); }
    h1 { margin-bottom: 24px; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    article { padding: 20px; border-radius: 16px; background: #1c293b; box-shadow: 0 8px 24px #0003; }
    .label { color: #aab7cc; }
    .value { display: block; margin-top: 8px; font-size: clamp(28px, 5vw, 44px); font-weight: 700; }
    #status { margin-top: 18px; color: #aab7cc; }
    @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <h1>Elförbrukning</h1>
    <section class="grid">
      <article><span class="label">Aktuell effekt</span><strong class="value" id="power">—</strong></article>
      <article><span class="label">Importerat totalt</span><strong class="value" id="import">—</strong></article>
      <article><span class="label">Exporterats totalt</span><strong class="value" id="export">—</strong></article>
    </section>
    <p id="status">Ansluter…</p>
  </main>
  <script>
    const number = value => typeof value === "number" ? value : null;

    async function update() {
      try {
        const response = await fetch("/api/measurement");
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Kunde inte läsa mätaren");

        const power = number(data.power_w);
        const imported = number(data.energy_import_kwh);
        const exported = number(data.energy_export_kwh);

        document.querySelector("#power").textContent = power === null ? "—" : `${power.toLocaleString("sv-SE")} W`;
        document.querySelector("#import").textContent = imported === null ? "—" : `${imported.toLocaleString("sv-SE", { maximumFractionDigits: 3 })} kWh`;
        document.querySelector("#export").textContent = exported === null ? "—" : `${exported.toLocaleString("sv-SE", { maximumFractionDigits: 3 })} kWh`;
        document.querySelector("#status").textContent = `Senast uppdaterad ${new Date().toLocaleTimeString("sv-SE")}`;
      } catch (error) {
        document.querySelector("#status").textContent = error.message;
      }
    }

    update();
    setInterval(update, 5000);
  </script>
</body>
</html>
